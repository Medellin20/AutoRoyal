version: '3.8'

# docker compose supports loading variables from a .env file located at the compose file
# directory. The file `.env` (or `.env.local`) should contain the values referenced below.

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      # Allow overrides from .env, with sensible defaults if absent
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-autoroyal}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  adminer:
    image: adminer
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      # Adminer connects to the DB service by default using the compose network name 'db'
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST:-db}

volumes:
  db-data:
    name: autoroyal_db_data

# Usage (local development):
# 1. Copy .env.example to .env and edit values as needed:
#    cp .env.example .env
# 2. docker compose up -d
# 3. Visit Adminer at http://localhost:${ADMINER_PORT:-8080}
# 4. Example DATABASE_URL (set in .env):
#    DATABASE_URL="postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-autoroyal}?schema=public"
# 5. Run migrations and seed:
#    npx prisma generate
#    npx prisma migrate dev --name init
#    npm run db:seed
# 6. npm run dev
